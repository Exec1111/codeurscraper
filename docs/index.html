<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Missions codeur.com</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --score-high: #16a34a;
    --score-mid: #d97706;
    --score-low: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #191c22;
      --text: #e8e8ea;
      --muted: #9aa0ab;
      --border: #2a2e37;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.25rem 0.5rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  #meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  main { max-width: 860px; margin: 0 auto; padding: 0 1.25rem 3rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
  .card-top a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.05rem; }
  .card-top a:hover { color: var(--accent); }
  .score {
    flex-shrink: 0;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    color: white;
    white-space: nowrap;
  }
  .reason { color: var(--muted); font-size: 0.92rem; margin: 0.5rem 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tag {
    font-size: 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    color: var(--muted);
  }
  .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }
</style>
</head>
<body>
<header>
  <h1>Missions codeur.com</h1>
  <div id="meta">Chargement…</div>
</header>
<main id="results"></main>

<script>
function scoreColor(score) {
  if (score >= 75) return "var(--score-high)";
  if (score >= 50) return "var(--score-mid)";
  return "var(--score-low)";
}

function formatDate(iso) {
  if (!iso) return "jamais";
  const d = new Date(iso);
  return d.toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });
}

fetch("./data/latest.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((data) => {
    document.getElementById("meta").textContent =
      `Dernière exécution : ${formatDate(data.generated_at)} · ` +
      `${data.new_listings_scanned} nouvelle(s) mission(s) analysée(s)`;

    const results = document.getElementById("results");
    if (!data.missions || data.missions.length === 0) {
      results.innerHTML = '<div class="empty">Aucune mission retenue pour le moment.</div>';
      return;
    }

    for (const m of data.missions) {
      const card = document.createElement("div");
      card.className = "card";
      const tags = (m.tags || [])
        .map((t) => `<span class="tag">${t}</span>`)
        .join("");
      card.innerHTML = `
        <div class="card-top">
          <a href="${m.url}" target="_blank" rel="noopener">${m.title}</a>
          <span class="score" style="background:${scoreColor(m.score)}">${m.score}/100</span>
        </div>
        <p class="reason">${m.reason || ""}</p>
        <div class="facts">
          <span>${m.budget || "Budget non précisé"}</span>
          <span>${m.offers ?? "?"} offres</span>
          <span>${m.views || ""}</span>
        </div>
        <div class="tags">${tags}</div>
      `;
      results.appendChild(card);
    }
  })
  .catch((err) => {
    document.getElementById("meta").textContent = "Erreur de chargement des données.";
    console.error(err);
  });
</script>
</body>
</html>
